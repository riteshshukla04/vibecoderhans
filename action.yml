name: VibeCoderHans PR review
description: Reviews a pull request with an Anthropic-compatible model and posts a review with inline comments.
branding:
  icon: eye
  color: purple

inputs:
  private-key:
    description: Private key of the VibeCoderHans GitHub App.
    required: true
  api-key:
    description: API key for the model provider (for Apex, your Callstack API key).
    required: true
  client-id:
    description: Client ID of the GitHub App that posts the review.
    default: Iv23liI6tleGwmoYWGIp
  base-url:
    description: Base URL of an Anthropic-compatible Messages API.
    default: https://api.callstack.ai
  model:
    description: Model ID to review with.
    default: callstack/Apex
  instructions:
    description: Extra review instructions for this repository, such as what the project is and what to focus on.
    default: ''
  exclude:
    description: Regular expression matched against file paths to leave out of the review, such as generated code. Lockfiles are always left out.
    default: ''
  max-diff-chars:
    description: Skip the review when the diff is longer than this many characters.
    default: '400000'

runs:
  using: composite
  steps:
    - name: Create app token
      id: app-token
      uses: actions/create-github-app-token@v3
      with:
        client-id: ${{ inputs.client-id }}
        private-key: ${{ inputs.private-key }}
        permission-pull-requests: write

    - name: Install dependencies
      shell: bash
      run: npm ci --prefix "$GITHUB_ACTION_PATH" --omit=dev --no-audit --no-fund

    - name: Review pull request
      shell: bash
      run: node "$GITHUB_ACTION_PATH/review.mjs"
      env:
        ANTHROPIC_BASE_URL: ${{ inputs.base-url }}
        ANTHROPIC_AUTH_TOKEN: ${{ inputs.api-key }}
        REVIEW_MODEL: ${{ inputs.model }}
        REVIEW_INSTRUCTIONS: ${{ inputs.instructions }}
        REVIEW_EXCLUDE: ${{ inputs.exclude }}
        REVIEW_MAX_DIFF_CHARS: ${{ inputs.max-diff-chars }}
        GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
        PR_NUMBER: ${{ github.event.pull_request.number }}
